<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر الديون</title>
<meta name="theme-color" content="#24478f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2324478f%22/%3E%3Crect x=%2216%22 y=%2211%22 width=%2232%22 height=%2242%22 rx=%224%22 fill=%22%23fff%22/%3E%3Crect x=%2216%22 y=%2211%22 width=%227%22 height=%2242%22 rx=%223%22 fill=%22%23b3261e%22/%3E%3Cpath d=%22M29 24h14M29 32h14M29 40h9%22 stroke=%22%2324478f%22 stroke-width=%223%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAACYUlEQVR42u3cwW3CMBSAYSdiD1QJ1FHgwDAwSRiGA6sgDohNekNV1VRNlIRn+/vvpZR8vIQSu9nsuiT9VuslEByCQ3AIDsEhOASH4BAcgkOCQ3AIDsEhOASH4BAcgkNwSHAIDsEhOASH4BAcgkNwqJpWYZ9Z9+jdG+Jwe5bx6m/358hPrwm4P8cfLIokElZJm6mMlNLlc10Mjvv1CMdkMvioC8dQGXz4tFJXoXxEwTFubJQ3PEL5MDkEh+EBh+AQHIJDcAgOwSE4BIcEh+AQHIJDcAgOwSE4BIfgkOAQHIJDcGjRVrX9wa/NDpZcG/J9h4WYC+prx/FjD4x3bYmx3Z9z8eG08n6mcDge+fkwOQSH4Ogr2jVgFtekJgcZcKR0vx4jHBX/5/Cudc0hOASHBIfgEByCQ3AIDsEhOASH6srd54v+0pTVN39tnTLSgndxBrnr3eQYcJCS1QkmR8z3q7vP5dOK4BAcZWZpAhx5HA9LE/jIW0ayNEEmh+AQHIJDcAgOwSE4BIfgkOAQHJokSxMmeKhU6Pd5Nsaf7MHL8+G0Mhc+OBy5kn2YHIJDcPS1zNViYdekJgcZcMy8Mb7/c3h/u+aQ4BAcgkNwCA7BITgEh+AQHIJDgkNwCA7BITgEh+AQHIJDcEhwCI6MC7JaHw7BoXxxnD5Oo3/2cHs6p5gcrjZqxTFueJQ0NqLtGhVrcgz1QUZdp5X/+yBj7prNrov5enWPrngWwXcfjItDTiuCQ3AIDsEhOCQ4BIfgEByCQ3AIDsEhOASHBIfgEByCQ3AIDsEhOASH4JDgEByCQ1P3BSQqlWpgWwqlAAAAAElFTkSuQmCC">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1c2530;--mute:#6a7686;--line:#d6dce5;--debt:#b3261e;--paid:#1f7a4d;--blue:#24478f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{font-size:1.1rem;margin:20px 0 8px}
input{width:100%;padding:12px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid #9db4e6;outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
button.debt{background:var(--debt)}button.pay{background:var(--paid)}
.row{display:flex;gap:8px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{padding:8px 12px}
.total{background:var(--ink);color:#fff;border-radius:12px;padding:18px;margin-bottom:14px}
.total small{opacity:.75;display:block}
.total b{font-size:2rem;font-weight:800}
.item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item small{color:var(--mute);display:block}
.amt{font-weight:800;white-space:nowrap}.amt.d{color:var(--debt)}.amt.z{color:var(--mute)}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.tx small{color:var(--mute);display:block}
.d{color:var(--debt)}.p{color:var(--paid)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.err{color:var(--debt);min-height:1.5em;margin:4px 0}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.hide{display:none}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:4px;width:40px;height:40px;padding:0;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center}
.danger{color:var(--debt);border-color:var(--debt)}
.sm{padding:4px 10px;font-size:.85rem}
.tx{align-items:center}
.phone{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phone .row{flex:none}.phone .row>*{flex:none}
.btnlink{display:inline-flex;align-items:center;justify-content:center;background:var(--paid);color:#fff;border-radius:8px;padding:12px 16px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>

<section id="login" class="hide">
  <h1 style="margin-top:40px">دفتر الديون</h1>
  <p style="color:var(--mute)">سجّل دخولك لتجد ديون زبائنك على أي هاتف.</p>
  <div class="card">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" dir="ltr">
    <div class="pw">
      <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" dir="ltr">
      <button type="button" class="eye" id="btnEye" aria-label="إظهار كلمة المرور"></button>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="row">
      <button id="btnLogin">تسجيل الدخول</button>
      <button id="btnSignup" class="ghost">إنشاء حساب</button>
    </div>
  </div>
</section>

<section id="list" class="hide">
  <div class="top"><h1>دفتر الديون</h1><button class="ghost" id="btnLogout">خروج</button></div>
  <div class="total"><small>مجموع ما لك عند الزبائن</small><b id="total">0</b> DA</div>
  <input id="search" placeholder="ابحث عن زبون">
  <button class="ghost" id="btnSort" style="width:100%;margin-bottom:10px">الترتيب: بالاسم</button>
  <div id="customers"></div>
  <h2>زبون جديد</h2>
  <div class="card">
    <input id="newName" placeholder="اسم الزبون">
    <input id="newPhone" type="tel" placeholder="رقم الهاتف (اختياري)" dir="ltr">
    <button id="btnAddCustomer" style="width:100%">إضافة الزبون</button>
  </div>
</section>

<section id="detail" class="hide">
  <div class="top"><button class="ghost" id="btnBack">رجوع</button></div>
  <div class="total"><small id="dName"></small><b id="dBalance">0</b> DA</div>
  <div class="card phone">
    <div id="dPhone" dir="ltr" style="font-weight:600"></div>
    <div class="row">
      <a class="btnlink" id="dCall" href="#">📞 اتصال</a>
      <button class="ghost" id="btnPhone">تعديل الرقم</button>
    </div>
  </div>
  <div class="card">
    <input id="amount" type="number" inputmode="decimal" min="0" placeholder="المبلغ بالدينار">
    <input id="note" placeholder="ملاحظة (اختياري)">
    <div class="err" id="txErr"></div>
    <div class="row">
      <button class="debt" id="btnDebt">سجّل دينًا</button>
      <button class="pay" id="btnPay">سجّل دفعة</button>
    </div>
  </div>
  <h2>السجل</h2>
  <div id="history"></div>
  <div class="err" id="delErr"></div>
  <button class="ghost danger" id="btnDelete" style="width:100%;margin-top:24px">حذف الزبون</button>
</section>

</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,getDocs,deleteDoc,updateDoc,onSnapshot,query,orderBy,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlL7M8VtxBxlYkc4u_oyRxL0YKZLhSzEQ",
  authDomain: "debts-notebook.firebaseapp.com",
  projectId: "debts-notebook",
  storageBucket: "debts-notebook.firebasestorage.app",
  messagingSenderId: "779357840731",
  appId: "1:779357840731:web:14c82341b8d3baef55e67e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("en-US");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show = id => ["login","list","detail"].forEach(s=>$(s).classList.toggle("hide",s!==id));

const msgs = {
  "auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة.",
  "auth/invalid-email":"البريد الإلكتروني غير صالح.",
  "auth/email-already-in-use":"هذا البريد مسجّل من قبل، اضغط تسجيل الدخول.",
  "auth/weak-password":"كلمة المرور قصيرة، استعمل 6 أحرف على الأقل.",
  "auth/missing-password":"اكتب كلمة المرور.",
  "auth/network-request-failed":"لا يوجد اتصال بالإنترنت.",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"مفتاح apiKey غير صحيح، انسخه من إعدادات المشروع مرة أخرى."
};

let sortDebt=false, uid=null, customers=[], current=null, unsubList=null, unsubTx=null;

async function authAction(fn){
  $("loginErr").textContent="";
  try{ await fn(auth,$("email").value.trim(),$("pass").value); }
  catch(e){ $("loginErr").textContent = msgs[e.code] || ("خطأ: "+e.code); }
}
$("btnLogin").onclick = () => authAction(signInWithEmailAndPassword);
$("btnSignup").onclick = () => authAction(createUserWithEmailAndPassword);
$("btnLogout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubList && unsubList(); unsubTx && unsubTx();
  if(!user){ uid=null; show("login"); return; }
  uid = user.uid; show("list");
  const q = query(collection(db,"users",uid,"customers"), orderBy("name"));
  unsubList = onSnapshot(q, snap => {
    customers = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderList();
    if(current){ const c=customers.find(x=>x.id===current); c ? renderHead(c) : showList(); }
  }, e => { $("customers").innerHTML = '<div class="empty">تعذّر تحميل البيانات: '+esc(e.code)+'</div>'; });
});

function renderList(){
  const term = $("search").value.trim().toLowerCase();
  let rows = customers.filter(c => !term || (c.name||"").toLowerCase().includes(term));
  if(sortDebt) rows = [...rows].sort((a,b) => (b.balance||0) - (a.balance||0));
  $("total").textContent = fmt(customers.reduce((s,c)=>s+(c.balance||0),0));
  $("customers").innerHTML = rows.length ? rows.map(c =>
    `<div class="item" data-id="${c.id}"><div>${esc(c.name)}<small dir="ltr" style="text-align:right">${esc(c.phone||"")}</small></div>
     <span class="amt ${c.balance>0?"d":"z"}">${fmt(c.balance)} DA</span></div>`).join("")
    : '<div class="empty">'+(customers.length?"لا نتيجة لهذا البحث.":"لا يوجد زبائن بعد. أضف أول زبون من الأسفل.")+'</div>';
}
$("search").oninput = renderList;
$("customers").onclick = e => { const it=e.target.closest(".item"); if(it) openCustomer(it.dataset.id); };

$("btnAddCustomer").onclick = async () => {
  const name=$("newName").value.trim();
  if(!name) return $("newName").focus();
  await addDoc(collection(db,"users",uid,"customers"),{name,phone:$("newPhone").value.trim(),balance:0,createdAt:serverTimestamp()});
  $("newName").value=""; $("newPhone").value="";
};

function renderHead(c){
  $("dName").textContent=c.name;
  $("dBalance").textContent=fmt(c.balance);
  const ph=(c.phone||"").trim(), call=$("dCall");
  $("dPhone").textContent = ph || "لا يوجد رقم هاتف";
  if(ph){ call.href="tel:"+ph.replace(/[^0-9+]/g,""); call.classList.remove("hide"); }
  else { call.removeAttribute("href"); call.classList.add("hide"); }
}
function openCustomer(id){
  current=id; renderHead(customers.find(c=>c.id===id)); show("detail");
  $("amount").value=""; $("note").value=""; $("txErr").textContent="";
  unsubTx && unsubTx();
  const q=query(collection(db,"users",uid,"customers",id,"tx"),orderBy("at","desc"));
  unsubTx=onSnapshot(q,snap=>{
    $("history").innerHTML = snap.empty ? '<div class="empty">لا توجد عمليات بعد.</div>' :
      snap.docs.map(d=>{const t=d.data();const date=t.at?t.at.toDate().toLocaleDateString("ar-DZ"):"";
        return `<div class="tx"><div>${t.type==="debt"?"دين":"دفعة"}<small>${esc(t.note||"")} ${date}</small></div>
        <div style="display:flex;align-items:center;gap:10px"><b class="${t.type==="debt"?"d":"p"}">${t.type==="debt"?"+":"−"}${fmt(t.amount)} DA</b>
        <button class="ghost danger sm" data-id="${d.id}" data-type="${t.type}" data-amt="${t.amount}">حذف</button></div></div>`}).join("");
  });
}
function showList(){ current=null; unsubTx && unsubTx(); show("list"); }
$("btnBack").onclick = showList;

async function addTx(type){
  const amount=parseFloat($("amount").value);
  if(!(amount>0)){ $("txErr").textContent="اكتب مبلغًا أكبر من صفر."; return; }
  $("txErr").textContent="";
  const batch=writeBatch(db);
  const cref=doc(db,"users",uid,"customers",current);
  batch.set(doc(collection(cref,"tx")),{type,amount,note:$("note").value.trim(),at:serverTimestamp()});
  batch.update(cref,{balance:increment(type==="debt"?amount:-amount)});
  try{ await batch.commit(); $("amount").value=""; $("note").value=""; }
  catch(e){ $("txErr").textContent="تعذّر الحفظ: "+e.code; }
}
$("btnDebt").onclick = () => addTx("debt");
$("btnPay").onclick = () => addTx("pay");

async function deleteCustomer(){
  const c = customers.find(x => x.id === current);
  if(!c) return;
  const warn = c.balance > 0 ? "\nتنبيه: لا يزال عليه " + fmt(c.balance) + " DA." : "";
  if(!confirm("حذف الزبون «" + c.name + "» وكل سجله نهائيًا؟" + warn)) return;
  $("delErr").textContent = "";
  const id = c.id;
  unsubTx && unsubTx();
  try{
    const cref = doc(db,"users",uid,"customers",id);
    const snap = await getDocs(collection(cref,"tx"));
    for(let i=0;i<snap.docs.length;i+=400){
      const b = writeBatch(db);
      snap.docs.slice(i,i+400).forEach(d => b.delete(d.ref));
      await b.commit();
    }
    await deleteDoc(cref);
    showList();
  }catch(e){ $("delErr").textContent = "تعذّر الحذف: " + e.code; }
}
$("btnDelete").onclick = deleteCustomer;

$("btnSort").onclick = () => {
  sortDebt = !sortDebt;
  $("btnSort").textContent = sortDebt ? "الترتيب: الأكبر دينًا" : "الترتيب: بالاسم";
  renderList();
};

$("btnPhone").onclick = async () => {
  const c = customers.find(x => x.id === current);
  if(!c) return;
  const v = prompt("رقم هاتف الزبون:", c.phone || "");
  if(v === null) return;
  try{ await updateDoc(doc(db,"users",uid,"customers",c.id), {phone: v.trim()}); }
  catch(e){ $("delErr").textContent = "تعذّر الحفظ: " + e.code; }
};

$("history").onclick = async e => {
  const b = e.target.closest("button[data-id]");
  if(!b) return;
  if(!confirm("حذف هذه العملية؟ سيُعدَّل الرصيد تلقائيًا.")) return;
  const amt = Number(b.dataset.amt), isDebt = b.dataset.type === "debt";
  const cref = doc(db,"users",uid,"customers",current);
  const batch = writeBatch(db);
  batch.delete(doc(cref,"tx",b.dataset.id));
  batch.update(cref,{balance: increment(isDebt ? -amt : amt)});
  try{ await batch.commit(); }
  catch(err){ $("delErr").textContent = "تعذّر الحذف: " + err.code; }
};

const eyeOn = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeOff = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
$("btnEye").innerHTML = eyeOn;
$("btnEye").onclick = () => {
  const p = $("pass"), showing = p.type === "password";
  p.type = showing ? "text" : "password";
  $("btnEye").innerHTML = showing ? eyeOff : eyeOn;
  $("btnEye").setAttribute("aria-label", showing ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
};
</script>
</body>
</html>
